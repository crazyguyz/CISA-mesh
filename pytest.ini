[pytest]
# v5.0.8 (Phase D): the suites in tests/ are named *_tests.py and are usually run
# directly (`python tests/alert_quality_tests.py`). Without this file pytest's
# default `test_*.py` pattern collected NOTHING, so `ci.yml` reported green while
# running zero tests. Keep this in sync with tools/tool_cli_tests.py.
python_files = *_tests.py
python_functions = test_*
addopts = -q -p no:cacheprovider
testpaths = tests
