# =============================================================================
# GIAM-SAT v3.0 Nginx TCP Stream Load Balancing
# =============================================================================
# Place this file: /etc/nginx/nginx.conf (or C:\nginx\conf\nginx.conf on Windows)
# Or include:      include /path/to/giamsat/server/nginx_tcp_stream.conf;
#
# Purpose: Distribute 1000 agent connections across 4 ingest servers.
# Agents connect to port 6666, Nginx proxies to backend ports 6667-6670.
#
# Install Nginx:
#   Ubuntu: sudo apt install nginx
#   Windows: https://nginx.org/en/download.html
#
# Enable stream module (Ubuntu):
#   sudo apt install libnginx-mod-stream
# =============================================================================

stream {
    # Logging
    log_format tcp '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log /var/log/nginx/giamsat_tcp_access.log tcp;
    error_log  /var/log/nginx/giamsat_tcp_error.log warn;

    # Upstream backend: 4 ingest servers
    upstream giamsat_ingest_backend {
        # Load balancing algorithm: least_conn (least connections first)
        least_conn;

        # Backend servers
        server 127.0.0.1:6667 max_fails=3 fail_timeout=30s weight=1;
        server 127.0.0.1:6668 max_fails=3 fail_timeout=30s weight=1;
        server 127.0.0.1:6669 max_fails=3 fail_timeout=30s weight=1;
        server 127.0.0.1:6670 max_fails=3 fail_timeout=30s weight=1;

        # Health checks (requires nginx-plus or nginx with health_check module)
        # For open-source nginx, use max_fails + fail_timeout parameters above

        # Keep connections alive
        keepalive 100;
        keepalive_timeout 300s;
    }

    # Main listener: agents connect to port 6666
    server {
        listen 6666;
        proxy_pass giamsat_ingest_backend;

        # Connection settings
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_buffer_size 64k;

        # Error handling
        proxy_next_upstream on;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
}