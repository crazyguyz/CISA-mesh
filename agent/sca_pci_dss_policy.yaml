# =============================================================================
# GIAM-SAT PCI DSS v4.0 Compliance Policy v1.13.0
# Payment Card Industry Data Security Standard
# Focus: Protect cardholder data, secure networks, access control, monitoring
# =============================================================================

metadata:
  name: "PCI DSS v4.0 Compliance Checks"
  version: "1.13.0"
  author: "GIAM-SAT"
  standard: "PCI DSS"
  description: "Security controls required for handling payment card data"
  total_requirements: 12
  last_updated: "2026-07-14"

windows_checks:
  # --- Requirement 1: Install and maintain network security controls ---
  - id: "PCI-1.1"
    title: "Firewall Enabled All Profiles"
    description: "Firewall must be active on all network profiles"
    method: "command"
    command: "netsh advfirewall show allprofiles state"
    parser: "parse_firewall_status"
    expected: "firewall_on_count >= 3"
    severity: "CRITICAL"
    remediation: "Enable Windows Firewall on all profiles via netsh advfirewall"
    pass_message: "Firewall ON all {firewall_on_count}/3 profiles"
    fail_message: "Firewall ON {firewall_on_count}/3 profiles (all required)"
    mapping: "PCI DSS Req 1.2"

  - id: "PCI-1.2"
    title: "Insecure Services Disabled"
    description: "Remote Registry, Telnet, SNMP must not be running"
    method: "powershell"
    command: "$svcs = @('RemoteRegistry','TlntSvr','SNMP'); $running = @(); foreach($s in $svcs) { try { $status = (Get-Service -Name $s -ErrorAction Stop).Status; if($status -eq 'Running') { $running += $s } } catch {} }; if($running.Count -eq 0) { Write-Output 'PASS:no_insecure_services' } else { Write-Output 'FAIL:' + ($running -join ',') }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Disable RemoteRegistry, Telnet, SNMP services"
    pass_message: "No insecure services running"
    fail_message: "Running insecure services: {message}"
    mapping: "PCI DSS Req 1.2"

  # --- Requirement 2: Apply secure configurations ---
  - id: "PCI-2.1"
    title: "Password Policy Min Length"
    description: "Minimum password length must be at least 12 characters"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_password_length"
    expected: "min_length >= 12"
    severity: "HIGH"
    remediation: "Set minimum password length to 12 via GPO or net accounts /minpwlen:12"
    pass_message: "Min password length: {min_length}"
    fail_message: "Min password length: {min_length} (12+ required)"
    mapping: "PCI DSS Req 2.2"

  - id: "PCI-2.2"
    title: "Password Max Age 90 Days"
    description: "Password maximum age must be 90 days or less"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_max_age"
    expected: "max_age >= 30 and max_age <= 90"
    severity: "HIGH"
    remediation: "Set maximum password age to 90 days"
    pass_message: "Password max age: {max_age} days"
    fail_message: "Password max age: {max_age} days (30-90 required)"
    mapping: "PCI DSS Req 2.2"

  - id: "PCI-2.3"
    title: "Account Lockout Threshold"
    description: "Account lockout must be enabled with threshold 6 or less"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_lockout"
    expected: "lockout >= 1 and lockout <= 6"
    severity: "HIGH"
    remediation: "Set account lockout threshold between 1-6"
    pass_message: "Lockout threshold: {lockout}"
    fail_message: "Lockout threshold: {lockout} (1-6 required)"
    mapping: "PCI DSS Req 8.3.4"

  # --- Requirement 3: Protect stored account data ---
  - id: "PCI-3.1"
    title: "BitLocker Drive Encryption"
    description: "Full disk encryption must be enabled for cardholder data protection"
    method: "powershell"
    command: "try { $v = Get-BitLockerVolume -MountPoint $env:SystemDrive; if($v.ProtectionStatus -eq 1) { Write-Output 'PASS:BitLocker enabled' } else { Write-Output 'FAIL:BitLocker not active' } } catch { Write-Output 'WARN:BitLocker not available' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable BitLocker on all drives containing cardholder data"
    pass_message: "BitLocker enabled on system drive"
    fail_message: "{message}"
    mapping: "PCI DSS Req 3.4"

  # --- Requirement 4: Encrypt transmission of cardholder data ---
  - id: "PCI-4.1"
    title: "SMBv1 Disabled"
    description: "SMBv1 protocol must be disabled (vulnerable to encryption downgrade)"
    method: "powershell"
    command: "$v = (Get-SmbServerConfiguration).EnableSMB1Protocol; if($v -eq $false) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Disable SMBv1: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol"
    pass_message: "SMBv1 disabled"
    fail_message: "SMBv1 enabled - vulnerable to attack"
    mapping: "PCI DSS Req 4.1"

  - id: "PCI-4.2"
    title: "TLS 1.0/1.1 Disabled"
    description: "Older TLS versions must be disabled for PCI compliance"
    method: "powershell"
    command: "try { $tls10 = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.0\\Server' -Name Enabled -ErrorAction Stop).Enabled; $tls11 = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.1\\Server' -Name Enabled -ErrorAction Stop).Enabled; if($tls10 -eq 0 -and $tls11 -eq 0) { 'PASS' } else { 'FAIL' } } catch { 'WARN:reg not found' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Disable TLS 1.0 and TLS 1.1 via registry or IISCrypto"
    pass_message: "TLS 1.0/1.1 disabled"
    fail_message: "TLS 1.0/1.1 still enabled"
    mapping: "PCI DSS Req 4.2"

  # --- Requirement 5: Protect against malware ---
  - id: "PCI-5.1"
    title: "Antivirus Enabled and Up-to-Date"
    description: "Windows Defender AV + Real-time protection must be active"
    method: "powershell"
    command: "$s = Get-MpComputerStatus; if($s.AntivirusEnabled -and $s.RealTimeProtectionEnabled) { 'PASS:AV+RT active' } else { $i = @(); if(!$s.AntivirusEnabled){$i+='AV'}; if(!$s.RealTimeProtectionEnabled){$i+='RT'}; Write-Output ('FAIL:' + ($i -join ',')) }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable Windows Defender AV and Real-time protection"
    pass_message: "AV and Real-time protection active"
    fail_message: "{message} disabled"
    mapping: "PCI DSS Req 5.2"

  # --- Requirement 6: Develop and maintain secure systems ---
  - id: "PCI-6.1"
    title: "Windows Update Automatic"
    description: "Windows Update must be configured for automatic installation"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    registry_value: "AUOptions"
    parser: "parse_registry_int"
    expected: "value >= 3"
    severity: "HIGH"
    remediation: "Configure Windows Update to auto-download and install"
    pass_message: "Auto-update configured (AUOptions={value})"
    fail_message: "Auto-update not configured (AUOptions={value})"
    mapping: "PCI DSS Req 6.2"

  - id: "PCI-6.2"
    title: "Application Patching Status"
    description: "No pending security updates should exist"
    method: "powershell"
    command: "$u = (New-Object -ComObject Microsoft.Update.Session).CreateUpdateSearcher().Search('IsInstalled=0 and Type=\"Software\"').Updates; if($u.Count -eq 0) { 'PASS:0 pending' } elseif($u.Count -le 5) { Write-Output ('WARN:' + $u.Count + ' pending') } else { Write-Output ('FAIL:' + $u.Count + ' pending') }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Install all pending security updates via Windows Update"
    pass_message: "No pending security updates"
    fail_message: "{message} security updates pending"
    mapping: "PCI DSS Req 6.2"

  # --- Requirement 7: Restrict access to cardholder data ---
  - id: "PCI-7.1"
    title: "UAC Enabled"
    description: "User Account Control must be enabled for least privilege"
    method: "powershell"
    command: "$uac = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA).EnableLUA; if($uac -eq 1) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable UAC via Control Panel or registry"
    pass_message: "UAC enabled"
    fail_message: "UAC disabled"
    mapping: "PCI DSS Req 7.2"

  # --- Requirement 8: Identify and authenticate access ---
  - id: "PCI-8.1"
    title: "NTLM Level Secure"
    description: "NTLM compatibility level must be 4 or 5 (send NTLMv2 only)"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa"
    registry_value: "LmCompatibilityLevel"
    parser: "parse_registry_hex_int"
    expected: "value >= 4"
    severity: "HIGH"
    remediation: "Set LmCompatibilityLevel to 5 via GPO or registry"
    pass_message: "NTLM level: {value} (secure)"
    fail_message: "NTLM level: {value} (4+ required)"
    mapping: "PCI DSS Req 8.2.1"

  - id: "PCI-8.2"
    title: "RDP Network Level Authentication"
    description: "RDP must require NLA for authentication security"
    method: "powershell"
    command: "$nla = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication).UserAuthentication; if($nla -eq 1) { 'PASS:NLA enabled' } else { 'FAIL:NLA disabled' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Enable Network Level Authentication for RDP"
    pass_message: "RDP NLA enabled"
    fail_message: "{message}"
    mapping: "PCI DSS Req 8.2.3"

  # --- Requirement 10: Log and monitor all access ---
  - id: "PCI-10.1"
    title: "Audit Policy Enabled"
    description: "Security audit logging must be enabled for key categories"
    method: "command"
    command: "auditpol /get /category:*"
    parser: "parse_audit_policy_pci"
    expected: "failed_categories == 0"
    severity: "CRITICAL"
    remediation: "Enable audit logging: auditpol /set /category:* /success:enable /failure:enable"
    pass_message: "All audit categories configured"
    fail_message: "{failed_categories} audit categories missing"
    mapping: "PCI DSS Req 10.2"

  - id: "PCI-10.2"
    title: "PowerShell ScriptBlock Logging"
    description: "PowerShell logging must be enabled for forensics"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
    registry_value: "EnableScriptBlockLogging"
    parser: "parse_registry_int"
    expected: "value == 1"
    severity: "HIGH"
    remediation: "Enable PowerShell ScriptBlock Logging via GPO"
    pass_message: "PowerShell ScriptBlock logging enabled"
    fail_message: "PowerShell ScriptBlock logging disabled"
    mapping: "PCI DSS Req 10.2"

  # --- Requirement 11: Test security systems ---
  - id: "PCI-11.1"
    title: "Windows Defender Signatures Updated"
    description: "AV signatures must be up-to-date (within 7 days)"
    method: "powershell"
    command: "$s = Get-MpComputerStatus; $age = $s.AntispywareSignatureAge; if($age -le 7) { Write-Output ('PASS:signatures ' + $age + 'd old') } else { Write-Output ('FAIL:signatures ' + $age + 'd old') }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Update Windows Defender signatures: Update-MpSignature"
    pass_message: "{message}"
    fail_message: "{message} (must be <= 7 days)"
    mapping: "PCI DSS Req 11.2"

  # --- Requirement 12: Maintain information security policy ---
  - id: "PCI-12.1"
    title: "Screen Lock Timeout"
    description: "Screen saver must activate with password after 15 min max"
    method: "registry"
    registry_key: "HKEY_CURRENT_USER\\Control Panel\\Desktop"
    registry_value: "ScreenSaveTimeOut"
    parser: "parse_registry_int"
    expected: "value >= 1 and value <= 900"
    severity: "MEDIUM"
    remediation: "Set screen saver timeout to 900 seconds (15 min) or less"
    pass_message: "Screen saver timeout: {value}s"
    fail_message: "Screen saver timeout: {value}s (1-900 required)"
    mapping: "PCI DSS Req 12.3"

linux_checks:
  - id: "PCI-L1"
    title: "Firewall Active (iptables/ufw)"
    description: "Host firewall must be active"
    method: "command"
    command: "iptables -L -n"
    parser: "parse_firewall_linux"
    expected: "firewall_active == True"
    severity: "CRITICAL"
    remediation: "Enable iptables/ufw with restrictive default policy"
    pass_message: "Firewall active with rules"
    fail_message: "No firewall detected"
    mapping: "PCI DSS Req 1.2"

  - id: "PCI-L2"
    title: "SSH Root Login Disabled"
    description: "Root login via SSH must be prohibited"
    method: "command"
    command: "grep -E '^PermitRootLogin' /etc/ssh/sshd_config"
    parser: "parse_ssh_config"
    expected: "PermitRootLogin in ('no', 'prohibit-password')"
    severity: "CRITICAL"
    remediation: "Set PermitRootLogin no in /etc/ssh/sshd_config"
    pass_message: "Root SSH login disabled"
    fail_message: "PermitRootLogin: {PermitRootLogin}"
    mapping: "PCI DSS Req 2.2"

  - id: "PCI-L3"
    title: "File Permissions Secure"
    description: "Critical files must have secure permissions (/etc/passwd 0644, /etc/shadow 0000)"
    method: "command"
    command: "stat -c '%a %n' /etc/passwd /etc/shadow 2>/dev/null"
    parser: "parse_file_perms"
    expected: "passwd_ok == True and shadow_ok == True"
    severity: "HIGH"
    remediation: "chmod 644 /etc/passwd && chmod 000 /etc/shadow"
    pass_message: "File permissions secure: passwd={passwd_perm}, shadow={shadow_perm}"
    fail_message: "Insecure permissions: passwd={passwd_perm}, shadow={shadow_perm}"
    mapping: "PCI DSS Req 2.2"

  - id: "PCI-L4"
    title: "auditd Active"
    description: "Audit daemon must be running and configured"
    method: "command"
    command: "auditctl -l"
    parser: "parse_audit_rules"
    expected: "rule_count >= 5"
    severity: "CRITICAL"
    remediation: "Configure auditd with rules for file access, privilege escalation, system calls"
    pass_message: "auditd with {rule_count} rules"
    fail_message: "auditd has {rule_count} rules (5+ required)"
    mapping: "PCI DSS Req 10.2"