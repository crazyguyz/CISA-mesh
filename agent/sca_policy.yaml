# =============================================================================
# GIAM-SAT SCA Policy v1.7.0
# Security Configuration Assessment - CIS Benchmark Checks
# YAML-based policy file, dễ dàng mở rộng mà không cần sửa code Python
# =============================================================================

# Global metadata
metadata:
  name: "GIAM-SAT Baseline SCA Policy"
  version: "1.7.0"
  author: "GIAM-SAT"
  description: "CIS-inspired security configuration checks for Windows and Linux"
  last_updated: "2026-07-11"

# =============================================================================
# Windows Checks (30+ checks)
# =============================================================================
windows_checks:
  # ---- Password Policy ----
  - id: "CIS-1.1.1"
    title: "Password Length Policy"
    description: "Minimum password length should be 14+ characters"
    severity: "HIGH"
    category: "password_policy"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_password_length"
    remediation: "net accounts /minpwlen:14"
    expected: "min_length >= 14"
    fail_message: "Min password length: {min_length} (14+ required)"
    pass_message: "Min password length: {min_length}"

  - id: "CIS-1.2.1"
    title: "Account Lockout Threshold"
    description: "Account lockout threshold should be 5+ attempts"
    severity: "MEDIUM"
    category: "password_policy"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_lockout"
    remediation: "net accounts /lockoutthreshold:5"
    expected: "lockout >= 5"
    fail_message: "Lockout threshold: {lockout} (5+ required)"
    pass_message: "Lockout threshold: {lockout}"

  - id: "CIS-1.1.2"
    title: "Password Max Age"
    description: "Password max age should be 30-90 days"
    severity: "MEDIUM"
    category: "password_policy"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_max_age"
    remediation: "net accounts /maxpwage:60"
    expected: "30 <= max_age <= 90"
    warn_condition: "max_age > 0 and (max_age < 30 or max_age > 90)"
    fail_message: "Password never expires"
    warn_message: "Max age: {max_age}d (30-90 recommended)"
    pass_message: "Max age: {max_age}d"

  # ---- Firewall ----
  - id: "CIS-9.1.1"
    title: "Windows Firewall State"
    description: "Windows Firewall should be enabled on all profiles"
    severity: "CRITICAL"
    category: "firewall"
    method: "command"
    command: "netsh advfirewall show allprofiles state"
    parser: "parse_firewall_state"
    remediation: "netsh advfirewall set allprofiles state on"
    expected: "on_count >= 3"

  # ---- Windows Defender ----
  - id: "CIS-18.9.44.1"
    title: "Windows Defender Status"
    description: "Antivirus and Real-time Protection should be enabled"
    severity: "CRITICAL"
    category: "defender"
    method: "powershell"
    command: "Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled | ConvertTo-Json"
    parser: "parse_defender_status"
    remediation: "Set-MpPreference -DisableRealtimeMonitoring $false"
    expected: "antivirus_enabled and realtime_enabled"

  # ---- Audit Policy ----
  - id: "CIS-17.1.1"
    title: "Audit Policy Configuration"
    description: "Key audit categories should log Success and Failure"
    severity: "HIGH"
    category: "audit_policy"
    method: "command"
    command: "auditpol /get /category:*"
    parser: "parse_audit_policy"
    remediation: "auditpol /set /category:* /success:enable /failure:enable"
    required_categories: ["Logon/Logoff", "Account Logon", "Account Management", "Policy Change", "Privilege Use"]

  # ---- UAC ----
  - id: "CIS-2.3.17.1"
    title: "User Account Control (UAC)"
    description: "UAC should be enabled"
    severity: "CRITICAL"
    category: "uac"
    method: "powershell"
    command: "Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA | Select-Object -ExpandProperty EnableLUA"
    parser: "parse_uac_status"
    remediation: "Enable UAC via Control Panel"
    expected: "uac_enabled"

  # ---- Insecure Services ----
  - id: "CIS-18.2"
    title: "Insecure Services"
    description: "Insecure services (RemoteRegistry, Telnet, SNMP) should not run"
    severity: "CRITICAL"
    category: "services"
    method: "command"
    command: "sc query"
    parser: "parse_insecure_services"
    remediation: "sc config {service} start= disabled"
    insecure_services: ["RemoteRegistry", "TlntSvr", "SNMP"]

  # ---- SMBv1 ----
  - id: "CIS-18.3.10"
    title: "SMBv1 Protocol"
    description: "SMBv1 should be disabled (WannaCry vector)"
    severity: "CRITICAL"
    category: "network_settings"
    method: "powershell"
    command: "(Get-SmbServerConfiguration).EnableSMB1Protocol"
    parser: "parse_smbv1_status"
    remediation: "Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol"
    expected: "smbv1_disabled"

  # ---- AutoLogon ----
  - id: "CIS-18.2.6"
    title: "AutoAdminLogon"
    description: "AutoAdminLogon should be disabled"
    severity: "CRITICAL"
    category: "autologon"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon"
    registry_value: "AutoAdminLogon"
    parser: "parse_autologon_status"
    remediation: "Set AutoAdminLogon registry value to 0"
    expected: "autologon_disabled"

  # ---- RDP ----
  - id: "CIS-18.8.1"
    title: "RDP Access"
    description: "RDP should be disabled or enforce NLA"
    severity: "MEDIUM"
    category: "rdp"
    method: "powershell"
    command: "(Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections).fDenyTSConnections"
    parser: "parse_rdp_status"
    remediation: "Disable RDP or enable NLA"

  # ===== NEW CHECKS v1.7.0 =====

  # ---- BitLocker ----
  - id: "CIS-18.9.65.1"
    title: "BitLocker Drive Encryption"
    description: "System drive should be encrypted with BitLocker"
    severity: "HIGH"
    category: "encryption"
    method: "powershell"
    command: "Get-BitLockerVolume -MountPoint $env:SystemDrive | Select-Object ProtectionStatus | ConvertTo-Json"
    parser: "parse_bitlocker_status"
    remediation: "Enable-BitLocker -MountPoint C: -EncryptionMethod XtsAes256"
    expected: "bitlocker_on"

  # ---- Screen Saver Timeout ----
  - id: "CIS-19.1.3.1"
    title: "Screen Saver Timeout"
    description: "Screen saver should activate within 15 minutes (900 seconds)"
    severity: "LOW"
    category: "screen_saver"
    method: "registry"
    registry_key: "HKEY_CURRENT_USER\\Control Panel\\Desktop"
    registry_value: "ScreenSaveTimeOut"
    parser: "parse_screensaver_timeout"
    remediation: "Set ScreenSaveTimeOut to 900 or less"
    expected: "timeout <= 900"
    fail_message: "Screen saver timeout: {timeout}s (should be <= 900s)"
    pass_message: "Screen saver timeout: {timeout}s"

  # ---- Screen Saver Password ----
  - id: "CIS-19.1.3.2"
    title: "Screen Saver Password Protection"
    description: "Screen saver should require password on resume"
    severity: "LOW"
    category: "screen_saver"
    method: "registry"
    registry_key: "HKEY_CURRENT_USER\\Control Panel\\Desktop"
    registry_value: "ScreenSaverIsSecure"
    parser: "parse_screensaver_password"
    remediation: "Set ScreenSaverIsSecure to 1"
    expected: "password_protected"

  # ---- NTLM Level ----
  - id: "CIS-2.3.11.11"
    title: "NTLM Authentication Level"
    description: "NTLM should be restricted (LMCompatibilityLevel >= 4)"
    severity: "HIGH"
    category: "ntlm"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa"
    registry_value: "LmCompatibilityLevel"
    parser: "parse_ntlm_level"
    remediation: "Set LmCompatibilityLevel to 5 (Send NTLMv2 only, refuse LM & NTLM)"
    expected: "lm_compat >= 4"
    fail_message: "NTLM level: {lm_compat} (should be 4 or 5)"
    pass_message: "NTLM level: {lm_compat}"

  # ---- SMB Signing ----
  - id: "CIS-18.3.11.1"
    title: "SMB Signing Required"
    description: "SMB signing should be required (prevents NTLM relay attacks)"
    severity: "HIGH"
    category: "smb_signing"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\Parameters"
    registry_value: "RequireSecuritySignature"
    parser: "parse_smb_signing_server"

  - id: "CIS-18.3.11.2"
    title: "SMB Client Signing Required"
    description: "SMB client signing should be required"
    severity: "HIGH"
    category: "smb_signing"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\LanmanWorkstation\\Parameters"
    registry_value: "RequireSecuritySignature"
    parser: "parse_smb_signing_client"
    remediation: "Set RequireSecuritySignature to 1"
    expected: "signing_enabled"

  # ---- PowerShell Logging ----
  - id: "CIS-18.9.100.1"
    title: "PowerShell ScriptBlock Logging"
    description: "PowerShell ScriptBlock logging should be enabled"
    severity: "HIGH"
    category: "powershell_logging"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
    registry_value: "EnableScriptBlockLogging"
    parser: "parse_registry_dword_enabled"
    remediation: "Enable PowerShell ScriptBlock Logging via GPO"

  - id: "CIS-18.9.100.2"
    title: "PowerShell Module Logging"
    description: "PowerShell Module logging should be enabled"
    severity: "MEDIUM"
    category: "powershell_logging"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ModuleLogging"
    registry_value: "EnableModuleLogging"
    parser: "parse_registry_dword_enabled"
    remediation: "Enable PowerShell Module Logging via GPO"

  - id: "CIS-18.9.100.3"
    title: "PowerShell Transcription"
    description: "PowerShell Transcription should be enabled"
    severity: "MEDIUM"
    category: "powershell_logging"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\Transcription"
    registry_value: "EnableTranscripting"
    parser: "parse_registry_dword_enabled"
    remediation: "Enable PowerShell Transcription via GPO"

  # ---- Windows Update ----
  - id: "CIS-18.9.85.1"
    title: "Windows Update - Automatic Updates"
    description: "Windows automatic updates should be configured"
    severity: "HIGH"
    category: "windows_update"
    method: "powershell"
    command: "Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU' -Name AUOptions -ErrorAction SilentlyContinue | Select-Object -ExpandProperty AUOptions"
    parser: "parse_windows_update"
    remediation: "Configure Windows Update to auto-install (AUOptions=4)"

  - id: "CIS-18.9.85.2"
    title: "Windows Update - NoAutoRebootWithLoggedOnUsers"
    description: "Automatic reboot with logged-on users should be disabled"
    severity: "LOW"
    category: "windows_update"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    registry_value: "NoAutoRebootWithLoggedOnUsers"
    parser: "parse_registry_dword_enabled"
    remediation: "Set NoAutoRebootWithLoggedOnUsers to 1"

  # ---- AppLocker ----
  - id: "CIS-18.9.65.3.1"
    title: "AppLocker - Executable Rules"
    description: "AppLocker executable rules should be enforced"
    severity: "MEDIUM"
    category: "applocker"
    method: "powershell"
    command: "Get-AppLockerPolicy -Effective -ErrorAction SilentlyContinue | Select-Object -ExpandProperty RuleCollections | Where-Object { $_.RuleCollectionType -eq 'Exe' } | ConvertTo-Json"
    parser: "parse_applocker_status"
    remediation: "Configure AppLocker executable rules via GPO"

  - id: "CIS-18.9.65.3.2"
    title: "AppLocker - DLL Rules"
    description: "AppLocker DLL rules should be enforced"
    severity: "LOW"
    category: "applocker"
    method: "powershell"
    command: "Get-AppLockerPolicy -Effective -ErrorAction SilentlyContinue | Select-Object -ExpandProperty RuleCollections | Where-Object { $_.RuleCollectionType -eq 'Dll' } | ConvertTo-Json"
    parser: "parse_applocker_dll_status"
    remediation: "Configure AppLocker DLL rules via GPO"

  # ---- RDP NLA ----
  - id: "CIS-18.8.2"
    title: "RDP Network Level Authentication"
    description: "RDP should require Network Level Authentication (NLA)"
    severity: "HIGH"
    category: "rdp"
    method: "powershell"
    command: "(Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication).UserAuthentication"
    parser: "parse_rdp_nla_status"
    remediation: "Set UserAuthentication to 1 for RDP-Tcp"

  # ---- Windows Defender Exploit Guard ----
  - id: "CIS-18.9.44.5.1"
    title: "Defender Exploit Guard - Network Protection"
    description: "Network Protection should be enabled (blocks malicious network traffic)"
    severity: "HIGH"
    category: "defender"
    method: "powershell"
    command: "Get-MpPreference | Select-Object EnableNetworkProtection | ConvertTo-Json"
    parser: "parse_network_protection"
    remediation: "Set-MpPreference -EnableNetworkProtection Enabled"

  # ---- Windows Defender Cloud ----
  - id: "CIS-18.9.44.3"
    title: "Defender Cloud-Delivered Protection"
    description: "Cloud-delivered protection (MAPS) should be enabled"
    severity: "HIGH"
    category: "defender"
    method: "powershell"
    command: "Get-MpPreference | Select-Object MAPSReporting | ConvertTo-Json"
    parser: "parse_maps_reporting"
    remediation: "Set-MpPreference -MAPSReporting Advanced"

  # ---- Windows Defender Sample Submission ----
  - id: "CIS-18.9.44.4"
    title: "Defender Sample Submission"
    description: "Automatic sample submission should be enabled"
    severity: "LOW"
    category: "defender"
    method: "powershell"
    command: "Get-MpPreference | Select-Object SubmitSamplesConsent | ConvertTo-Json"
    parser: "parse_sample_submission"
    remediation: "Set-MpPreference -SubmitSamplesConsent 1"

  # ---- LSASS Protection ----
  - id: "CIS-18.9.45.1"
    title: "LSASS Protection (PPL)"
    description: "LSASS should run as Protected Process Light (PPL)"
    severity: "HIGH"
    category: "lsass"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa"
    registry_value: "RunAsPPL"
    parser: "parse_registry_dword_enabled"
    remediation: "Set RunAsPPL to 1 (requires Secure Boot or registry)"

  # ---- Local Admin Group Check ----
  - id: "CIS-2.3.17.8"
    title: "Local Administrators Group"
    description: "Administrators group membership should be reviewed"
    severity: "HIGH"
    category: "local_admin"
    method: "powershell"
    command: "Get-LocalGroupMember -Group 'Administrators' | Select-Object Name,PrincipalSource | ConvertTo-Json"
    parser: "parse_local_admin_members"
    remediation: "Review and remove unnecessary accounts from Administrators group"

  # ---- Guest Account ----
  - id: "CIS-2.3.12.1"
    title: "Guest Account Status"
    description: "Guest account should be disabled"
    severity: "MEDIUM"
    category: "guest_account"
    method: "powershell"
    command: "Get-LocalUser -Name 'Guest' -ErrorAction SilentlyContinue | Select-Object Enabled | ConvertTo-Json"
    parser: "parse_guest_account"
    remediation: "Disable-LocalUser -Name Guest"
    expected: "guest_disabled"

  # ---- Microsoft Defender Antivirus Signature Update ----
  - id: "CIS-18.9.44.2"
    title: "Defender Signature Age"
    description: "Antivirus signatures should be up-to-date (less than 7 days old)"
    severity: "HIGH"
    category: "defender"
    method: "powershell"
    command: "Get-MpComputerStatus | Select-Object AntivirusSignatureAge,AntispywareSignatureAge | ConvertTo-Json"
    parser: "parse_signature_age"
    remediation: "Update-MpSignature"

  # ---- Anonymous SID Enumeration ----
  - id: "CIS-2.3.10.5"
    title: "Anonymous SID Enumeration"
    description: "Anonymous SID/Name translation should be restricted"
    severity: "HIGH"
    category: "network_security"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa"
    registry_value: "RestrictAnonymousSAM"
    parser: "parse_registry_dword_enabled"
    remediation: "Set RestrictAnonymousSAM to 1"

  # ===== End Windows Checks =====

# =============================================================================
# Linux Checks (15+ checks)
# =============================================================================
linux_checks:
  - id: "CIS-5.4.1.1"
    title: "Password Min Length (Linux)"
    description: "PASS_MIN_LEN should be >= 14"
    severity: "HIGH"
    category: "password_policy"
    method: "command"
    command: "grep -E '^PASS_MIN_LEN' /etc/login.defs"
    parser: "parse_login_defs_minlen"
    remediation: "Set PASS_MIN_LEN 14 in /etc/login.defs"
    expected: "min_len >= 14"

  - id: "CIS-5.4.1.2"
    title: "Password Max Days (Linux)"
    description: "PASS_MAX_DAYS should be 30-90"
    severity: "MEDIUM"
    category: "password_policy"
    method: "command"
    command: "grep -E '^PASS_MAX_DAYS' /etc/login.defs"
    parser: "parse_login_defs_maxdays"
    remediation: "Set PASS_MAX_DAYS 60 in /etc/login.defs"

  - id: "CIS-3.5.1.1"
    title: "Firewall Status (Linux)"
    description: "iptables or UFW should be active with restrictive policy"
    severity: "CRITICAL"
    category: "firewall"
    method: "command"
    command: "iptables -L -n 2>/dev/null || ufw status 2>/dev/null"
    parser: "parse_linux_firewall"
    remediation: "Enable and configure iptables/UFW"

  - id: "CIS-4.1.1"
    title: "auditd Status (Linux)"
    description: "auditd should have rules configured"
    severity: "CRITICAL"
    category: "audit_policy"
    method: "command"
    command: "auditctl -l 2>/dev/null"
    parser: "parse_auditd_rules"
    remediation: "Configure auditd rules via /etc/audit/rules.d/"

  - id: "CIS-5.2.3"
    title: "SSH PermitRootLogin"
    description: "SSH root login should be disabled"
    severity: "HIGH"
    category: "ssh_config"
    method: "command"
    command: "grep -E '^PermitRootLogin' /etc/ssh/sshd_config 2>/dev/null"
    parser: "parse_ssh_permit_root"
    remediation: "Set PermitRootLogin no in /etc/ssh/sshd_config"
    expected: "PermitRootLogin in ('no', 'prohibit-password')"

  - id: "CIS-5.2.4"
    title: "SSH PasswordAuthentication"
    description: "SSH password authentication should be disabled (use keys)"
    severity: "MEDIUM"
    category: "ssh_config"
    method: "command"
    command: "grep -E '^PasswordAuthentication' /etc/ssh/sshd_config 2>/dev/null"
    parser: "parse_ssh_password_auth"
    remediation: "Set PasswordAuthentication no in /etc/ssh/sshd_config"

  - id: "CIS-5.2.5"
    title: "SSH Protocol Version"
    description: "Only SSH Protocol 2 should be allowed"
    severity: "HIGH"
    category: "ssh_config"
    method: "command"
    command: "grep -E '^Protocol' /etc/ssh/sshd_config 2>/dev/null"
    parser: "parse_ssh_protocol"
    remediation: "Set Protocol 2 in /etc/ssh/sshd_config"

  - id: "CIS-5.2.6"
    title: "SSH MaxAuthTries"
    description: "SSH MaxAuthTries should be 4 or less"
    severity: "MEDIUM"
    category: "ssh_config"
    method: "command"
    command: "grep -E '^MaxAuthTries' /etc/ssh/sshd_config 2>/dev/null"
    parser: "parse_ssh_max_auth_tries"
    remediation: "Set MaxAuthTries 4 in /etc/ssh/sshd_config"

  - id: "CIS-6.1.1"
    title: "File Permissions: /etc/passwd"
    description: "/etc/passwd should be 0644"
    severity: "HIGH"
    category: "file_permissions"
    method: "file_stat"
    file_path: "/etc/passwd"
    expected_mode: "0644"
    remediation: "chmod 644 /etc/passwd"

  - id: "CIS-6.1.2"
    title: "File Permissions: /etc/shadow"
    description: "/etc/shadow should be 0000 or 0400"
    severity: "CRITICAL"
    category: "file_permissions"
    method: "file_stat"
    file_path: "/etc/shadow"
    expected_mode: "0000"
    remediation: "chmod 000 /etc/shadow"

  - id: "CIS-6.1.3"
    title: "File Permissions: /etc/ssh/sshd_config"
    description: "SSH config should be 0600"
    severity: "MEDIUM"
    category: "file_permissions"
    method: "file_stat"
    file_path: "/etc/ssh/sshd_config"
    expected_mode: "0600"
    remediation: "chmod 600 /etc/ssh/sshd_config"

  - id: "CIS-3.2.1"
    title: "Kernel Parameters: IP Forwarding"
    description: "IP forwarding should be disabled"
    severity: "MEDIUM"
    category: "kernel_params"
    method: "command"
    command: "sysctl net.ipv4.ip_forward 2>/dev/null"
    parser: "parse_sysctl_enabled"
    remediation: "Set net.ipv4.ip_forward = 0 in /etc/sysctl.conf"
    expected: "disabled"

  - id: "CIS-3.2.2"
    title: "Kernel Parameters: ICMP Redirects"
    description: "ICMP redirects should not be accepted"
    severity: "MEDIUM"
    category: "kernel_params"
    method: "command"
    command: "sysctl net.ipv4.conf.all.accept_redirects 2>/dev/null"
    parser: "parse_sysctl_enabled"
    remediation: "Set net.ipv4.conf.all.accept_redirects = 0 in /etc/sysctl.conf"
    expected: "disabled"

  - id: "CIS-3.2.3"
    title: "Kernel Parameters: Source Routed Packets"
    description: "Source routed packets should not be accepted"
    severity: "MEDIUM"
    category: "kernel_params"
    method: "command"
    command: "sysctl net.ipv4.conf.all.accept_source_route 2>/dev/null"
    parser: "parse_sysctl_enabled"
    remediation: "Set net.ipv4.conf.all.accept_source_route = 0 in /etc/sysctl.conf"
    expected: "disabled"

  - id: "CIS-1.1.1.1"
    title: "Kernel Modules: cramfs"
    description: "Unused filesystem kernel modules should be blacklisted"
    severity: "LOW"
    category: "kernel_modules"
    method: "command"
    command: "lsmod | grep cramfs 2>/dev/null"
    parser: "parse_kernel_module_loaded"
    remediation: "Add 'install cramfs /bin/true' to /etc/modprobe.d/cramfs.conf"
    expected: "not_loaded"

  - id: "CIS-1.1.1.2"
    title: "Kernel Modules: freevxfs"
    description: "Unused filesystem (freevxfs) should not be loaded"
    severity: "LOW"
    category: "kernel_modules"
    method: "command"
    command: "lsmod | grep freevxfs 2>/dev/null"
    parser: "parse_kernel_module_loaded"
    remediation: "Add 'install freevxfs /bin/true' to /etc/modprobe.d/freevxfs.conf"
    expected: "not_loaded"

  - id: "CIS-1.1.1.3"
    title: "Kernel Modules: squashfs"
    description: "Unused filesystem (squashfs) should not be loaded"
    severity: "LOW"
    category: "kernel_modules"
    method: "command"
    command: "lsmod | grep squashfs 2>/dev/null"
    parser: "parse_kernel_module_loaded"
    remediation: "Add 'install squashfs /bin/true' to /etc/modprobe.d/squashfs.conf"
    expected: "not_loaded"

  # ---- NEW Linux Checks v1.7.0 ----
  - id: "CIS-5.2.7"
    title: "SSH AllowUsers/AllowGroups"
    description: "SSH should restrict access via AllowUsers or AllowGroups"
    severity: "MEDIUM"
    category: "ssh_config"
    method: "command"
