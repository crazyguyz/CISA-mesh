# =============================================================================
# GIAM-SAT HIPAA Compliance Policy v1.13.0
# Health Insurance Portability and Accountability Act
# Focus: PHI protection, access control, audit controls, integrity, transmission security
# =============================================================================

metadata:
  name: "HIPAA Security Rule Compliance Checks"
  version: "1.13.0"
  author: "GIAM-SAT"
  standard: "HIPAA"
  description: "Technical safeguards for HIPAA Security Rule (45 CFR 164.312)"
  last_updated: "2026-07-14"

windows_checks:
  # --- 164.312(a)(1) - Access Control ---
  - id: "HIPAA-A1"
    title: "Unique User Identification"
    description: "Each user must have unique credentials (no shared accounts)"
    method: "powershell"
    command: "$disabled = (Get-LocalUser | Where-Object {$_.Enabled -eq $false}).Count; $total = (Get-LocalUser).Count; Write-Output ('total=' + $total + ' disabled=' + $disabled)"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "MEDIUM"
    remediation: "Ensure all users have unique accounts; disable guest account"
    pass_message: "User accounts: total={total}, disabled={disabled}"
    fail_message: "Check user account management"
    mapping: "HIPAA 164.312(a)(1)"

  - id: "HIPAA-A2"
    title: "Emergency Access Procedure"
    description: "UAC must be active to restrict PHI access (emergency override logged)"
    method: "powershell"
    command: "$uac = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA).EnableLUA; if($uac -eq 1) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable UAC to enforce role-based access control"
    pass_message: "Access control (UAC) enforced"
    fail_message: "UAC disabled - PHI access not controlled"
    mapping: "HIPAA 164.312(a)(1)"

  - id: "HIPAA-A3"
    title: "Automatic Logoff / Screen Lock"
    description: "Session must auto-lock after 15 minutes of inactivity"
    method: "powershell"
    command: "$timeout = (Get-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveTimeOut -ErrorAction SilentlyContinue).ScreenSaveTimeOut; $secure = (Get-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaverIsSecure -ErrorAction SilentlyContinue).ScreenSaverIsSecure; if($timeout -and $timeout -gt 0 -and $timeout -le 900 -and $secure -eq '1') { 'PASS:timeout=' + $timeout } else { Write-Output ('FAIL:timeout=' + $timeout + ' secure=' + $secure) }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Configure screen saver timeout <= 15 min with password lock"
    pass_message: "Auto-lock configured ({message})"
    fail_message: "Auto-lock not configured: {message}"
    mapping: "HIPAA 164.312(a)(2)(iii)"

  - id: "HIPAA-A4"
    title: "PHI Encryption at Rest"
    description: "ePHI must be encrypted when stored (BitLocker)"
    method: "powershell"
    command: "try { $v = Get-BitLockerVolume -MountPoint $env:SystemDrive; if($v.ProtectionStatus -eq 1) { Write-Output 'PASS:' + $v.EncryptionMethod } else { 'FAIL:not encrypted' } } catch { 'WARN:BitLocker not available' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable BitLocker with AES-256 on all drives storing PHI"
    pass_message: "ePHI encrypted ({message})"
    fail_message: "{message}"
    mapping: "HIPAA 164.312(a)(2)(iv)"

  # --- 164.312(b) - Audit Controls ---
  - id: "HIPAA-B1"
    title: "Audit Logging Enabled (All Categories)"
    description: "All PHI access must be logged and reviewed"
    method: "command"
    command: "auditpol /get /category:*"
    parser: "parse_audit_policy_pci"
    expected: "failed_categories == 0"
    severity: "CRITICAL"
    remediation: "Enable all Windows audit categories for PHI access tracking"
    pass_message: "Comprehensive audit logging active"
    fail_message: "{failed_categories} audit categories not logging"
    mapping: "HIPAA 164.312(b)"

  - id: "HIPAA-B2"
    title: "PowerShell Command Logging"
    description: "All administrative commands must be logged"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
    registry_value: "EnableScriptBlockLogging"
    parser: "parse_registry_int"
    expected: "value == 1"
    severity: "HIGH"
    remediation: "Enable PowerShell ScriptBlock logging via GPO"
    pass_message: "PowerShell audit logging enabled"
    fail_message: "PowerShell audit logging disabled"
    mapping: "HIPAA 164.312(b)"

  - id: "HIPAA-B3"
    title: "Process Creation Auditing"
    description: "Event ID 4688 must be audited for PHI access tracking"
    method: "powershell"
    command: "$r = auditpol /get /subcategory:'Process Creation'; if($r -match 'Success and Failure') { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Enable Process Creation auditing: auditpol /set /subcategory:\"Process Creation\" /success:enable /failure:enable"
    pass_message: "Process creation auditing active"
    fail_message: "Process creation auditing not fully enabled"
    mapping: "HIPAA 164.312(b)"

  # --- 164.312(c)(1) - Integrity ---
  - id: "HIPAA-C1"
    title: "Antivirus Active and Up-to-Date"
    description: "Malware protection required for PHI integrity"
    method: "powershell"
    command: "$s = Get-MpComputerStatus; if($s.AntivirusEnabled -and $s.RealTimeProtectionEnabled -and $s.AntispywareSignatureAge -le 7) { 'PASS:signatures=' + $s.AntispywareSignatureAge + 'd' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Ensure Windows Defender is active with current signatures"
    pass_message: "AV active, signatures: {message}"
    fail_message: "AV protection incomplete"
    mapping: "HIPAA 164.312(c)(1)"

  - id: "HIPAA-C2"
    title: "Secure SMB Configuration"
    description: "SMBv1 must be disabled to prevent PHI tampering"
    method: "powershell"
    command: "$v = (Get-SmbServerConfiguration).EnableSMB1Protocol; if($v -eq $false) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Disable SMBv1 to protect PHI data integrity"
    pass_message: "SMBv1 disabled - data integrity protected"
    fail_message: "SMBv1 enabled - PHI integrity at risk"
    mapping: "HIPAA 164.312(c)(1)"

  # --- 164.312(d) - Person or Entity Authentication ---
  - id: "HIPAA-D1"
    title: "Strong Password Policy"
    description: "Minimum 12 character passwords required for PHI access"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_password_length"
    expected: "min_length >= 12"
    severity: "HIGH"
    remediation: "Enforce minimum 12-character passwords via GPO"
    pass_message: "Min password length: {min_length}"
    fail_message: "Min password length: {min_length} (12+ required)"
    mapping: "HIPAA 164.312(d)"

  - id: "HIPAA-D2"
    title: "Account Lockout Protection"
    description: "Brute force protection for PHI access credentials"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_lockout"
    expected: "lockout >= 1 and lockout <= 6"
    severity: "HIGH"
    remediation: "Set account lockout to 5 attempts"
    pass_message: "Account lockout after {lockout} attempts"
    fail_message: "Account lockout: {lockout} (1-6 required)"
    mapping: "HIPAA 164.312(d)"

  - id: "HIPAA-D3"
    title: "NTLMv2 Only Authentication"
    description: "Weak NTLM must be disabled for PHI security"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa"
    registry_value: "LmCompatibilityLevel"
    parser: "parse_registry_hex_int"
    expected: "value >= 4"
    severity: "HIGH"
    remediation: "Set LmCompatibilityLevel=5 (NTLMv2 only)"
    pass_message: "NTLM level {value} (secure)"
    fail_message: "NTLM level {value} (4+ required)"
    mapping: "HIPAA 164.312(d)"

  # --- 164.312(e)(1) - Transmission Security ---
  - id: "HIPAA-E1"
    title: "Firewall Active All Profiles"
    description: "Network firewall must protect PHI transmission"
    method: "command"
    command: "netsh advfirewall show allprofiles state"
    parser: "parse_firewall_status"
    expected: "firewall_on_count >= 3"
    severity: "CRITICAL"
    remediation: "Enable firewall on all profiles"
    pass_message: "Firewall ON all {firewall_on_count}/3 profiles"
    fail_message: "Firewall only on {firewall_on_count}/3 profiles"
    mapping: "HIPAA 164.312(e)(1)"

  - id: "HIPAA-E2"
    title: "TLS 1.0/1.1 Disabled"
    description: "Only TLS 1.2+ for PHI transmission"
    method: "powershell"
    command: "try { $tls10 = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.0\\Server' -Name Enabled -ErrorAction Stop).Enabled; $tls11 = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.1\\Server' -Name Enabled -ErrorAction Stop).Enabled; if($tls10 -eq 0 -and $tls11 -eq 0) { 'PASS' } else { 'FAIL' } } catch { 'WARN:check failed' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Disable TLS 1.0/1.1, enable TLS 1.2+ only"
    pass_message: "TLS 1.0/1.1 disabled"
    fail_message: "TLS 1.0/1.1 still enabled"
    mapping: "HIPAA 164.312(e)(1)"

  - id: "HIPAA-E3"
    title: "RDP with NLA Required"
    description: "Remote access must require network level authentication"
    method: "powershell"
    command: "try { $nla = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication).UserAuthentication; if($nla -eq 1) { 'PASS' } else { 'FAIL' } } catch { 'FAIL:not configured' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Enable Network Level Authentication for RDP"
    pass_message: "RDP with NLA enabled"
    fail_message: "{message}"
    mapping: "HIPAA 164.312(e)(1)"

  # --- Security Management Process ---
  - id: "HIPAA-SM1"
    title: "Windows Updates Current"
    description: "Risk analysis requires up-to-date patching"
    method: "powershell"
    command: "$u = (New-Object -ComObject Microsoft.Update.Session).CreateUpdateSearcher().Search('IsInstalled=0 and Type=\"Software\"').Updates; if($u.Count -eq 0) { 'PASS:up-to-date' } elseif($u.Count -le 5) { Write-Output ('WARN:' + $u.Count + ' pending') } else { Write-Output ('FAIL:' + $u.Count + ' pending') }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Install all pending security updates"
    pass_message: "All security patches installed"
    fail_message: "{message}"
    mapping: "HIPAA 164.308(a)(1)(ii)(A)"

  - id: "HIPAA-SM2"
    title: "Insecure Services Disabled"
    description: "Telnet, Remote Registry must be disabled per risk analysis"
    method: "powershell"
    command: "$svcs = @('RemoteRegistry','TlntSvr'); $running = @(); foreach($s in $svcs) { try { $status = (Get-Service -Name $s -ErrorAction Stop).Status; if($status -eq 'Running') { $running += $s } } catch {} }; if($running.Count -eq 0) { 'PASS:secure' } else { Write-Output ('FAIL:' + ($running -join ',')) }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Disable all insecure network services"
    pass_message: "All insecure services disabled"
    fail_message: "Running insecure services: {message}"
    mapping: "HIPAA 164.308(a)(1)"

linux_checks:
  - id: "HIPAA-L1"
    title: "Disk Encryption (LUKS) for ePHI"
    description: "PHI must be encrypted at rest"
    method: "command"
    command: "lsblk -o NAME,MOUNTPOINT,FSTYPE | grep -E 'crypt|LUKS'"
    parser: "parse_encryption_status"
    expected: "encryption_found == True"
    severity: "CRITICAL"
    remediation: "Enable LUKS encryption for all ePHI storage"
    pass_message: "ePHI encrypted volumes found"
    fail_message: "No encrypted volumes - PHI at risk"
    mapping: "HIPAA 164.312(a)(2)(iv)"

  - id: "HIPAA-L2"
    title: "auditd Configured for PHI Access"
    description: "All ePHI access must be logged"
    method: "command"
    command: "auditctl -l"
    parser: "parse_audit_rules"
    expected: "rule_count >= 8"
    severity: "CRITICAL"
    remediation: "Configure auditd to log all PHI file access and system calls"
    pass_message: "auditd configured ({rule_count} rules)"
    fail_message: "auditd has {rule_count} rules (8+ required)"
    mapping: "HIPAA 164.312(b)"

  - id: "HIPAA-L3"
    title: "Firewall Active"
    description: "Network protection for PHI transmission"
    method: "command"
    command: "iptables -L -n"
    parser: "parse_firewall_linux"
    expected: "firewall_active == True"
    severity: "CRITICAL"
    remediation: "Configure iptables with restrictive policy"
    pass_message: "Firewall active"
    fail_message: "No firewall detected"
    mapping: "HIPAA 164.312(e)(1)"

  - id: "HIPAA-L4"
    title: "SSH Root Login Disabled"
    description: "Root access restriction for PHI security"
    method: "command"
    command: "grep -E '^PermitRootLogin' /etc/ssh/sshd_config"
    parser: "parse_ssh_config"
    expected: "PermitRootLogin in ('no', 'prohibit-password')"
    severity: "CRITICAL"
    remediation: "Set PermitRootLogin no"
    pass_message: "SSH root login: {PermitRootLogin}"
    fail_message: "SSH root login: {PermitRootLogin}"
    mapping: "HIPAA 164.312(a)(1)"