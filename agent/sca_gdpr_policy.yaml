# =============================================================================
# GIAM-SAT GDPR Compliance Policy v1.13.0
# General Data Protection Regulation (EU) 2016/679
# Focus: Data protection, privacy, consent, breach notification, right to erasure
# =============================================================================

metadata:
  name: "GDPR Compliance Checks"
  version: "1.13.0"
  author: "GIAM-SAT"
  standard: "GDPR"
  description: "Technical controls for EU General Data Protection Regulation"
  total_articles: 99
  last_updated: "2026-07-14"

windows_checks:
  # --- Article 5: Principles relating to processing of personal data ---
  - id: "GDPR-5.1"
    title: "Data Encryption at Rest (BitLocker)"
    description: "Personal data must be encrypted at rest (Art. 5(1)(f) - integrity and confidentiality)"
    method: "powershell"
    command: "try { $v = Get-BitLockerVolume -MountPoint $env:SystemDrive; if($v.ProtectionStatus -eq 1) { Write-Output 'PASS:encrypted' } else { Write-Output 'FAIL:not encrypted' } } catch { Write-Output 'WARN:not available' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable BitLocker on all drives containing personal data"
    pass_message: "Drive encryption active"
    fail_message: "{message}"
    mapping: "GDPR Art. 5(1)(f), 32(1)(a)"

  - id: "GDPR-5.2"
    title: "User Account Control Enabled"
    description: "Access to personal data must be restricted to authorized personnel (Art. 5(1)(f))"
    method: "powershell"
    command: "$uac = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA).EnableLUA; if($uac -eq 1) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable UAC to enforce least privilege access"
    pass_message: "UAC enabled - access control enforced"
    fail_message: "UAC disabled"
    mapping: "GDPR Art. 5(1)(f), 25"

  # --- Article 25: Data protection by design and by default ---
  - id: "GDPR-25.1"
    title: "Screen Lock with Password"
    description: "Automatic screen lock must protect data from unauthorized viewing (privacy by default)"
    method: "powershell"
    command: "$timeout = (Get-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveTimeOut).ScreenSaveTimeOut; $secure = (Get-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaverIsSecure).ScreenSaverIsSecure; if($timeout -gt 0 -and $timeout -le 600 -and $secure -eq '1') { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Set screen saver timeout <= 10 min with password protection"
    pass_message: "Screen lock configured"
    fail_message: "Screen lock not properly configured"
    mapping: "GDPR Art. 25(2)"

  # --- Article 30: Records of processing activities ---
  - id: "GDPR-30.1"
    title: "Audit Logging Enabled"
    description: "All access to personal data must be logged (Art. 30 - processing records)"
    method: "command"
    command: "auditpol /get /category:*"
    parser: "parse_audit_policy_pci"
    expected: "failed_categories == 0"
    severity: "CRITICAL"
    remediation: "Enable comprehensive audit logging for accountability"
    pass_message: "Audit logging fully configured"
    fail_message: "{failed_categories} audit categories not configured"
    mapping: "GDPR Art. 30"

  - id: "GDPR-30.2"
    title: "PowerShell Logging Enabled"
    description: "Command execution must be logged for processing activity records"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
    registry_value: "EnableScriptBlockLogging"
    parser: "parse_registry_int"
    expected: "value == 1"
    severity: "HIGH"
    remediation: "Enable PowerShell logging for command audit trail"
    pass_message: "PowerShell logging enabled"
    fail_message: "PowerShell logging disabled"
    mapping: "GDPR Art. 30"

  # --- Article 32: Security of processing ---
  - id: "GDPR-32.1"
    title: "Firewall Active"
    description: "Network security controls must protect personal data (Art. 32(1)(b))"
    method: "command"
    command: "netsh advfirewall show allprofiles state"
    parser: "parse_firewall_status"
    expected: "firewall_on_count >= 3"
    severity: "CRITICAL"
    remediation: "Enable firewall on all network profiles"
    pass_message: "Firewall active on all {firewall_on_count}/3 profiles"
    fail_message: "Firewall only on {firewall_on_count}/3 profiles"
    mapping: "GDPR Art. 32(1)(b)"

  - id: "GDPR-32.2"
    title: "Antivirus Protection"
    description: "Malware protection required for data integrity (Art. 32(1)(b))"
    method: "powershell"
    command: "$s = Get-MpComputerStatus; if($s.AntivirusEnabled -and $s.RealTimeProtectionEnabled) { 'PASS:AV active' } else { 'FAIL:AV issue' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Ensure antivirus is active and up-to-date"
    pass_message: "Antivirus and real-time protection active"
    fail_message: "Antivirus protection incomplete"
    mapping: "GDPR Art. 32(1)(b)"

  - id: "GDPR-32.3"
    title: "Strong Password Policy"
    description: "Minimum 12 character passwords required for data security"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_password_length"
    expected: "min_length >= 12"
    severity: "HIGH"
    remediation: "Set minimum password length to 12+ characters"
    pass_message: "Password min length: {min_length}"
    fail_message: "Password min length: {min_length} (12+ required)"
    mapping: "GDPR Art. 32(1)(d)"

  - id: "GDPR-32.4"
    title: "Account Lockout Policy"
    description: "Brute force protection required (Art. 32 - appropriate technical measures)"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_lockout"
    expected: "lockout >= 1 and lockout <= 6"
    severity: "HIGH"
    remediation: "Configure account lockout after 5-6 failed attempts"
    pass_message: "Account lockout: {lockout} attempts"
    fail_message: "Account lockout: {lockout} (1-6 required)"
    mapping: "GDPR Art. 32(1)(d)"

  - id: "GDPR-32.5"
    title: "Windows Updates Current"
    description: "System must be patched against known vulnerabilities (Art. 32(1)(d))"
    method: "powershell"
    command: "$u = (New-Object -ComObject Microsoft.Update.Session).CreateUpdateSearcher().Search('IsInstalled=0 and Type=\"Software\"').Updates; if($u.Count -eq 0) { 'PASS:0 pending' } elseif($u.Count -le 5) { Write-Output ('WARN:' + $u.Count + ' pending') } else { Write-Output ('FAIL:' + $u.Count + ' pending') }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Install all pending security updates"
    pass_message: "All updates installed"
    fail_message: "{message}"
    mapping: "GDPR Art. 32(1)(d)"

  # --- Article 33: Notification of a personal data breach ---
  - id: "GDPR-33.1"
    title: "Data Breach Detection Capability"
    description: "System must have intrusion detection capability (72-hour notification requirement)"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
    registry_value: "EnableScriptBlockLogging"
    parser: "parse_registry_int"
    expected: "value == 1"
    severity: "HIGH"
    remediation: "Enable comprehensive logging for breach detection within 72 hours"
    pass_message: "Breach detection logging enabled"
    fail_message: "Insufficient logging for breach detection"
    mapping: "GDPR Art. 33"

  # --- Article 35: Data Protection Impact Assessment ---
  - id: "GDPR-35.1"
    title: "SMBv1 Disabled"
    description: "Vulnerable protocols must be disabled (DPIA requirement)"
    method: "powershell"
    command: "$v = (Get-SmbServerConfiguration).EnableSMB1Protocol; if($v -eq $false) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Disable SMBv1 to prevent data exposure attacks"
    pass_message: "SMBv1 disabled"
    fail_message: "SMBv1 enabled - data exposure risk"
    mapping: "GDPR Art. 35"

  - id: "GDPR-35.2"
    title: "Insecure Network Services"
    description: "Remote Registry, Telnet must be disabled (data protection impact)"
    method: "powershell"
    command: "$svcs = @('RemoteRegistry','TlntSvr'); $running = @(); foreach($s in $svcs) { try { $status = (Get-Service -Name $s -ErrorAction Stop).Status; if($status -eq 'Running') { $running += $s } } catch {} }; if($running.Count -eq 0) { 'PASS:secure' } else { Write-Output ('FAIL:' + ($running -join ',')) }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Disable Remote Registry and Telnet services"
    pass_message: "No insecure network services"
    fail_message: "Insecure services: {message}"
    mapping: "GDPR Art. 35"

linux_checks:
  - id: "GDPR-L1"
    title: "Disk Encryption (LUKS)"
    description: "Personal data must be encrypted at rest"
    method: "command"
    command: "lsblk -o NAME,MOUNTPOINT,FSTYPE | grep -E 'crypt|LUKS'"
    parser: "parse_encryption_status"
    expected: "encryption_found == True"
    severity: "CRITICAL"
    remediation: "Enable LUKS encryption on partitions containing personal data"
    pass_message: "Encrypted volumes found"
    fail_message: "No encrypted volumes detected"
    mapping: "GDPR Art. 5(1)(f), 32(1)(a)"

  - id: "GDPR-L2"
    title: "Firewall Active"
    description: "Network security controls required"
    method: "command"
    command: "iptables -L -n"
    parser: "parse_firewall_linux"
    expected: "firewall_active == True"
    severity: "CRITICAL"
    remediation: "Configure iptables/ufw with restrictive default policy"
    pass_message: "Host firewall active"
    fail_message: "No firewall detected"
    mapping: "GDPR Art. 32(1)(b)"

  - id: "GDPR-L3"
    title: "auditd Enabled"
    description: "All processing must be logged for accountability"
    method: "command"
    command: "auditctl -l"
    parser: "parse_audit_rules"
    expected: "rule_count >= 5"
    severity: "CRITICAL"
    remediation: "Configure comprehensive auditd rules for data access tracking"
    pass_message: "auditd configured with {rule_count} rules"
    fail_message: "auditd has {rule_count} rules (5+ required)"
    mapping: "GDPR Art. 30"

  - id: "GDPR-L4"
    title: "File Permissions for Sensitive Data"
    description: "/etc/shadow must be restricted (personal data access control)"
    method: "command"
    command: "stat -c '%a %n' /etc/shadow /etc/passwd 2>/dev/null"
    parser: "parse_file_perms"
    expected: "shadow_ok == True"
    severity: "HIGH"
    remediation: "Set /etc/shadow permissions to 000"
    pass_message: "Sensitive file permissions: shadow={shadow_perm}"
    fail_message: "Insecure shadow permissions: {shadow_perm}"
    mapping: "GDPR Art. 25, 32"