# =============================================================================
# GIAM-SAT ISO/IEC 27001:2022 Compliance Policy v1.13.0
# International standard for Information Security Management Systems (ISMS)
# Focus: Annex A controls - organizational, people, physical, technological
# =============================================================================

metadata:
  name: "ISO 27001:2022 Annex A Compliance Checks"
  version: "1.13.0"
  author: "GIAM-SAT"
  standard: "ISO 27001"
  description: "Technical controls mapping to ISO 27001:2022 Annex A"
  total_controls: 93
  last_updated: "2026-07-14"

windows_checks:
  # --- A.5 Organizational controls (policy, roles, responsibilities) ---
  - id: "ISO-A5.1"
    title: "Security Audit Policy Enabled"
    description: "Audit logging required for security monitoring and compliance (A.5.35)"
    method: "command"
    command: "auditpol /get /category:*"
    parser: "parse_audit_policy_pci"
    expected: "failed_categories == 0"
    severity: "CRITICAL"
    remediation: "Enable all audit categories to meet ISMS logging requirements"
    pass_message: "All audit categories logging"
    fail_message: "{failed_categories} audit categories missing"
    mapping: "ISO 27001 A.5.35 (Independent review of information security)"

  - id: "ISO-A5.2"
    title: "Information Security Policy Documentation"
    description: "System must have documented security controls (A.5.1)"
    method: "powershell"
    command: "$fw = (netsh advfirewall show allprofiles state | Select-String 'ON').Count; $av = (Get-MpComputerStatus).AntivirusEnabled; $uac = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA).EnableLUA; if($fw -ge 3 -and $av -and $uac -eq 1) { 'PASS:basic controls active' } else { 'FAIL:controls incomplete' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Ensure firewall, AV, and UAC are all active per security policy"
    pass_message: "Core security controls active"
    fail_message: "Core security controls incomplete"
    mapping: "ISO 27001 A.5.1 (Policies for information security), A.5.8 (Information security in project management)"

  # --- A.5.15 Access Control ---
  - id: "ISO-A5.15.1"
    title: "Least Privilege Access (UAC)"
    description: "Access must be restricted to authorized users only (A.5.15)"
    method: "powershell"
    command: "$uac = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA).EnableLUA; if($uac -eq 1) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable UAC for least privilege enforcement"
    pass_message: "Least privilege access control active"
    fail_message: "UAC disabled - no least privilege"
    mapping: "ISO 27001 A.5.15 (Access control), A.5.18 (Access rights)"

  - id: "ISO-A5.15.2"
    title: "Strong Authentication Policy"
    description: "Password must be minimum 12 characters (A.5.17)"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_password_length"
    expected: "min_length >= 12"
    severity: "HIGH"
    remediation: "Enforce minimum 12-character passwords"
    pass_message: "Password policy: {min_length} chars min"
    fail_message: "Password policy: {min_length} chars (12+ required)"
    mapping: "ISO 27001 A.5.17 (Authentication information)"

  - id: "ISO-A5.15.3"
    title: "Account Lockout for Brute Force"
    description: "Must lock accounts after failed attempts (A.5.17)"
    method: "command"
    command: "net accounts"
    parser: "parse_net_accounts_lockout"
    expected: "lockout >= 1 and lockout <= 6"
    severity: "HIGH"
    remediation: "Set account lockout threshold to 5"
    pass_message: "Lockout after {lockout} attempts"
    fail_message: "Lockout: {lockout} attempts (1-6 required)"
    mapping: "ISO 27001 A.5.17 (Authentication information)"

  # --- A.5.24 Information security incident management ---
  - id: "ISO-A5.24.1"
    title: "Incident Detection Logging"
    description: "Must be able to detect and log security incidents (A.5.24)"
    method: "powershell"
    command: "$pslog = (Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Name EnableScriptBlockLogging -ErrorAction SilentlyContinue).EnableScriptBlockLogging; $proc = (auditpol /get /subcategory:'Process Creation' | Select-String 'Success and Failure'); if($pslog -eq 1 -and $proc) { 'PASS:logging active' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Enable PowerShell logging and Process Creation auditing"
    pass_message: "Incident detection logging active"
    fail_message: "Incident detection logging incomplete"
    mapping: "ISO 27001 A.5.24 (Information security incident management planning), A.5.25 (Assessment of security events)"

  # --- A.5.29 - ICT readiness for business continuity ---
  - id: "ISO-A5.29.1"
    title: "System Updates Current"
    description: "System must be patched for business continuity (A.5.29)"
    method: "powershell"
    command: "$u = (New-Object -ComObject Microsoft.Update.Session).CreateUpdateSearcher().Search('IsInstalled=0 and Type=\"Software\"').Updates; if($u.Count -eq 0) { 'PASS:all patched' } elseif($u.Count -le 10) { Write-Output ('WARN:' + $u.Count + ' pending') } else { Write-Output ('FAIL:' + $u.Count + ' pending') }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Install all pending updates for business continuity"
    pass_message: "All updates installed"
    fail_message: "{message}"
    mapping: "ISO 27001 A.5.29 (ICT readiness), A.8.8 (Technical vulnerability management)"

  # --- A.8 Technological controls ---
  # --- A.8.1 User endpoint devices ---
  - id: "ISO-A8.1.1"
    title: "Endpoint Protection (AV)"
    description: "All endpoints must have malware protection (A.8.1)"
    method: "powershell"
    command: "$s = Get-MpComputerStatus; if($s.AntivirusEnabled -and $s.RealTimeProtectionEnabled) { 'PASS:AV+RT' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable Windows Defender with real-time protection"
    pass_message: "Endpoint protection active"
    fail_message: "Endpoint protection not fully active"
    mapping: "ISO 27001 A.8.1 (User endpoint devices)"

  - id: "ISO-A8.1.2"
    title: "Screen Lock / Auto-Lock"
    description: "Endpoints must auto-lock after inactivity (A.8.1)"
    method: "powershell"
    command: "$timeout = (Get-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveTimeOut -ErrorAction SilentlyContinue).ScreenSaveTimeOut; $secure = (Get-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaverIsSecure -ErrorAction SilentlyContinue).ScreenSaverIsSecure; if($timeout -gt 0 -and $timeout -le 600 -and $secure -eq '1') { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "MEDIUM"
    remediation: "Configure screen saver with password after 10 min max"
    pass_message: "Endpoint auto-lock configured"
    fail_message: "Auto-lock not properly configured"
    mapping: "ISO 27001 A.8.1 (User endpoint devices)"

  # --- A.8.3 Information access restriction ---
  - id: "ISO-A8.3.1"
    title: "Encryption at Rest (BitLocker)"
    description: "Data must be encrypted at rest (A.8.3, A.8.24)"
    method: "powershell"
    command: "try { $v = Get-BitLockerVolume -MountPoint $env:SystemDrive; if($v.ProtectionStatus -eq 1) { 'PASS:encrypted' } else { 'FAIL:not encrypted' } } catch { 'WARN:not available' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Enable BitLocker on all data drives"
    pass_message: "Data encryption at rest active"
    fail_message: "{message}"
    mapping: "ISO 27001 A.8.3 (Information access restriction), A.8.24 (Use of cryptography)"

  # --- A.8.7 Protection against malware ---
  - id: "ISO-A8.7.1"
    title: "Malware Signature Currency"
    description: "AV signatures must be current (< 7 days) (A.8.7)"
    method: "powershell"
    command: "$s = Get-MpComputerStatus; $age = $s.AntispywareSignatureAge; if($age -le 7) { Write-Output ('PASS:' + $age + 'd old') } else { Write-Output ('FAIL:' + $age + 'd old') }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Update antivirus signatures immediately"
    pass_message: "AV signatures: {message}"
    fail_message: "AV signatures outdated: {message}"
    mapping: "ISO 27001 A.8.7 (Protection against malware)"

  # --- A.8.8 Technical vulnerability management ---
  - id: "ISO-A8.8.1"
    title: "Windows Update Auto-Configured"
    description: "Automatic patch management required (A.8.8)"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"
    registry_value: "AUOptions"
    parser: "parse_registry_int"
    expected: "value >= 3"
    severity: "HIGH"
    remediation: "Configure automatic Windows Updates"
    pass_message: "Auto-update: AUOptions={value}"
    fail_message: "Auto-update not configured (AUOptions={value})"
    mapping: "ISO 27001 A.8.8 (Technical vulnerability management)"

  # --- A.8.12 Data leakage prevention ---
  - id: "ISO-A8.12.1"
    title: "Insecure Protocols Disabled (SMBv1)"
    description: "Vulnerable protocols must be disabled (A.8.12)"
    method: "powershell"
    command: "$v = (Get-SmbServerConfiguration).EnableSMB1Protocol; if($v -eq $false) { 'PASS' } else { 'FAIL' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "CRITICAL"
    remediation: "Disable SMBv1 to prevent data leakage"
    pass_message: "SMBv1 disabled - data leakage prevented"
    fail_message: "SMBv1 enabled - data leakage risk"
    mapping: "ISO 27001 A.8.12 (Data leakage prevention)"

  - id: "ISO-A8.12.2"
    title: "Removable Media Control"
    description: "Insecure services (Telnet, Remote Registry) must be disabled (A.8.12)"
    method: "powershell"
    command: "$svcs = @('RemoteRegistry','TlntSvr'); $running = @(); foreach($s in $svcs) { try { $status = (Get-Service -Name $s -ErrorAction Stop).Status; if($status -eq 'Running') { $running += $s } } catch {} }; if($running.Count -eq 0) { 'PASS:secure' } else { Write-Output ('FAIL:' + ($running -join ',')) }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Disable RemoteRegistry and Telnet services"
    pass_message: "Insecure services disabled"
    fail_message: "Running insecure services: {message}"
    mapping: "ISO 27001 A.8.12 (Data leakage prevention)"

  # --- A.8.16 Monitoring activities ---
  - id: "ISO-A8.16.1"
    title: "PowerShell Audit Logging"
    description: "All administrative actions must be logged (A.8.16)"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging"
    registry_value: "EnableScriptBlockLogging"
    parser: "parse_registry_int"
    expected: "value == 1"
    severity: "HIGH"
    remediation: "Enable PowerShell ScriptBlock logging"
    pass_message: "Command audit logging enabled"
    fail_message: "Command audit logging disabled"
    mapping: "ISO 27001 A.8.16 (Monitoring activities)"

  # --- A.8.20 Network security ---
  - id: "ISO-A8.20.1"
    title: "Firewall All Profiles"
    description: "Network firewall required on all interfaces (A.8.20)"
    method: "command"
    command: "netsh advfirewall show allprofiles state"
    parser: "parse_firewall_status"
    expected: "firewall_on_count >= 3"
    severity: "CRITICAL"
    remediation: "Enable firewall on Domain, Private, and Public profiles"
    pass_message: "Network firewall active on all {firewall_on_count}/3 profiles"
    fail_message: "Network firewall only {firewall_on_count}/3 profiles"
    mapping: "ISO 27001 A.8.20 (Network security)"

  - id: "ISO-A8.20.2"
    title: "NTLMv2 Only"
    description: "Secure authentication required for network (A.8.20)"
    method: "registry"
    registry_key: "HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa"
    registry_value: "LmCompatibilityLevel"
    parser: "parse_registry_hex_int"
    expected: "value >= 4"
    severity: "HIGH"
    remediation: "Set LmCompatibilityLevel to 5 (NTLMv2 only)"
    pass_message: "NTLM secure level: {value}"
    fail_message: "NTLM level: {value} (4+ required)"
    mapping: "ISO 27001 A.8.20 (Network security), A.8.5 (Secure authentication)"

  # --- A.8.22 Web filtering ---
  - id: "ISO-A8.22.1"
    title: "TLS 1.0/1.1 Disabled"
    description: "Web security requires modern TLS (A.8.22, A.8.24)"
    method: "powershell"
    command: "try { $tls10 = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.0\\Server' -Name Enabled -ErrorAction Stop).Enabled; $tls11 = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.1\\Server' -Name Enabled -ErrorAction Stop).Enabled; if($tls10 -eq 0 -and $tls11 -eq 0) { 'PASS' } else { 'FAIL' } } catch { 'WARN:check failed' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Disable TLS 1.0 and 1.1, enable TLS 1.2+"
    pass_message: "TLS 1.0/1.1 disabled"
    fail_message: "Insecure TLS versions enabled"
    mapping: "ISO 27001 A.8.22 (Web filtering), A.8.24 (Use of cryptography)"

  # --- A.8.26 Application security ---
  - id: "ISO-A8.26.1"
    title: "RDP with NLA"
    description: "Remote access must use secure authentication (A.8.26)"
    method: "powershell"
    command: "try { $nla = (Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication).UserAuthentication; if($nla -eq 1) { 'PASS' } else { 'FAIL' } } catch { 'FAIL:not configured' }"
    parser: "parse_simple_pass_fail"
    expected: "status == 'PASS'"
    severity: "HIGH"
    remediation: "Require Network Level Authentication for RDP"
    pass_message: "RDP NLA enabled"
    fail_message: "{message}"
    mapping: "ISO 27001 A.8.26 (Application security requirements)"

linux_checks:
  - id: "ISO-L1"
    title: "Host Firewall Active (iptables/ufw)"
    description: "Network security control required (A.8.20)"
    method: "command"
    command: "iptables -L -n"
    parser: "parse_firewall_linux"
    expected: "firewall_active == True"
    severity: "CRITICAL"
    remediation: "Configure iptables with default DROP policy"
    pass_message: "Host firewall active"
    fail_message: "No firewall detected"
    mapping: "ISO 27001 A.8.20 (Network security)"

  - id: "ISO-L2"
    title: "auditd Monitoring Rules"
    description: "Security monitoring required (A.8.16)"
    method: "command"
    command: "auditctl -l"
    parser: "parse_audit_rules"
    expected: "rule_count >= 5"
    severity: "CRITICAL"
    remediation: "Configure auditd with comprehensive rules"
    pass_message: "auditd: {rule_count} rules active"
    fail_message: "auditd: {rule_count} rules (5+ required)"
    mapping: "ISO 27001 A.8.16 (Monitoring activities), A.5.25 (Assessment of security events)"

  - id: "ISO-L3"
    title: "Disk Encryption (LUKS)"
    description: "Cryptographic protection of data (A.8.24)"
    method: "command"
    command: "lsblk -o NAME,MOUNTPOINT,FSTYPE | grep -E 'crypt|LUKS'"
    parser: "parse_encryption_status"
    expected: "encryption_found == True"
    severity: "CRITICAL"
    remediation: "Enable LUKS encryption on all data partitions"
    pass_message: "Encrypted storage: volumes={volume_count}"
    fail_message: "No encrypted volumes found"
    mapping: "ISO 27001 A.8.24 (Use of cryptography)"

  - id: "ISO-L4"
    title: "SSH Configuration Secure"
    description: "Secure remote access required (A.8.20, A.8.5)"
    method: "command"
    command: "grep -E '^(PermitRootLogin|PasswordAuthentication)' /etc/ssh/sshd_config"
    parser: "parse_ssh_config"
    expected: "PermitRootLogin in ('no', 'prohibit-password')"
    severity: "CRITICAL"
    remediation: "Set PermitRootLogin no in sshd_config"
    pass_message: "SSH root login: {PermitRootLogin}"
    fail_message: "SSH root login: {PermitRootLogin} (must be no)"
    mapping: "ISO 27001 A.8.20 (Network security), A.5.15 (Access control)"

  - id: "ISO-L5"
    title: "Critical File Permissions"
    description: "Access control for sensitive files (A.5.15)"
    method: "command"
    command: "stat -c '%a %n' /etc/passwd /etc/shadow /etc/ssh/sshd_config 2>/dev/null"
    parser: "parse_file_perms"
    expected: "passwd_ok == True and shadow_ok == True"
    severity: "HIGH"
    remediation: "Set secure permissions: chmod 644 passwd, chmod 000 shadow, chmod 600 sshd_config"
    pass_message: "File permissions: passwd={passwd_perm}, shadow={shadow_perm}"
    fail_message: "Insecure permissions: passwd={passwd_perm}, shadow={shadow_perm}"
    mapping: "ISO 27001 A.5.15 (Access control), A.5.18 (Access rights)"

  - id: "ISO-L6"
    title: "Password Policy (min 12 chars)"
    description: "Strong authentication required (A.5.17)"
    method: "command"
    command: "grep '^PASS_MIN_LEN' /etc/login.defs"
    parser: "parse_pass_min_len"
    expected: "min_length >= 12"
    severity: "HIGH"
    remediation: "Set PASS_MIN_LEN 12 in /etc/login.defs"
    pass_message: "Password min length: {min_length}"
    fail_message: "Password min length: {min_length} (12+ required)"
    mapping: "ISO 27001 A.5.17 (Authentication information)"