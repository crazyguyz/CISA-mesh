name: Build Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 4.5.2)'
        required: true
        default: '4.5.2'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Agent
    runs-on: windows-latest
    steps:
      - name: Checkout
        # v4.10 (LOW-13): pinned to the actions/checkout v4 commit (floating tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        # v4.10 (LOW-13): pinned to the actions/setup-python v5 commit
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyyaml psutil scapy cryptography watchdog pywin32

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build GiamSatAgent.exe + GiamSatUpdater.exe
        shell: pwsh
        run: |
          .\build-agent.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: giamsat-agent-v${{ steps.version.outputs.VERSION }}
          path: |
            dist/GiamSatAgent.exe
            dist/GiamSatUpdater.exe
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          gh release view "v$v" --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$v already exists, removing..."
            gh release delete "v$v" --yes --cleanup-tag | Out-Null
          }
          gh release create "v$v" "dist/GiamSatAgent.exe" "dist/GiamSatUpdater.exe" --title "GIAM-SAT v$v" --generate-notes --latest
